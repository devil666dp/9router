services:
  9router:
    image: dipandhali2021/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      # Uncomment (or set DATABASE_URL in .env) to store state in Postgres
      # instead of the SQLite file under DATA_DIR. Keep the volume either way —
      # DATA_DIR still holds MITM certs, logs and runtime config. An unreachable
      # URL fails startup rather than falling back to SQLite. See DOCKER.md.
      # DATABASE_URL: postgres://9router:9router@postgres:5432/9router
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
